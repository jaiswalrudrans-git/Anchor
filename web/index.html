<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anchor</title>
  <meta name="description" content="Plan it. Do it. Anchor it. Personal anti-procrastination, academics, expenses, and habits.">

  <!-- Theme Colors -->
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">

  <!-- Open Graph -->
  <meta property="og:title" content="Anchor">
  <meta property="og:description" content="Plan it. Do it. Anchor it. Personal anti-procrastination, academics, expenses, and habits.">
  <meta property="og:image" content="og-image.png">

  <!-- Favicons and Touch Icons -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anchor">

  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent browser (Edge/Chrome/Safari) from rendering native input placeholders over Flutter's canvas */
    input::placeholder,
    textarea::placeholder {
      color: transparent !important;
      -webkit-text-fill-color: transparent !important;
      opacity: 0 !important;
    }
  </style>
</head>
